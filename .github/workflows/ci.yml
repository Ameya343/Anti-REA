name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo. No write scopes, no secrets.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # Actions pinned to a full commit SHA (supply-chain hardening); comment = tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (flake8)
        run: flake8 antirea   # config in setup.cfg (keeps local == CI)

      - name: Test (pytest)
        run: pytest -q

      - name: Anti-REA self-demo (informational)
        run: python -m antirea test-rea examples/sample-app

      - name: Anti-REA resistance gate (hardened sample must clear 55)
        run: |
          python -m antirea harden examples/sample-app /tmp/hardened --no-rescore
          python -m antirea score /tmp/hardened --min-resistance 55

  # Optional accelerator: build the Rust core and prove it matches Python
  # exactly. Not in the required set, so it never blocks a merge on its own.
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Build Rust core (cargo is preinstalled on the runner)
        run: cargo build --release --manifest-path core/Cargo.toml

      - name: Parity test (Rust core == Python scanner)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q tests/test_rust_parity.py
